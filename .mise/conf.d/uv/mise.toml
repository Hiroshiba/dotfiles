min_version = "2026.10.17"

[tools]
uv = "latest"

[dotfiles."~/.config/uv/uv.toml"]
source = "uv.toml"
mode = "copy"
variants = [
  { os = "linux" },
  { os = "macos" },
  { os = "windows", target = "~/AppData/Roaming/uv/uv.toml" },
]

[dotfiles."~/.config/uv/.python-version"]
source = ".python-version"
mode = "copy"
variants = [
  { os = "linux" },
  { os = "macos" },
  { os = "windows", target = "~/AppData/Roaming/uv/.python-version" },
]
