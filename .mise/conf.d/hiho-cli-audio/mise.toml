min_version = "2026.10.0"

[vars]
hiho_cli_audio_gemini_api_key = { age = "" }

[dotfiles."hiho-cli-audio/config.yaml"]
source = "config.yaml.tera"
mode = "template"
permissions = "0600"
variants = [
  { os = "macos", target = "~/Library/Application Support/hiho-cli-audio/config.yaml" },
  { os = "windows", target = "~/AppData/Roaming/hiho-cli-audio/config.yaml" },
]
